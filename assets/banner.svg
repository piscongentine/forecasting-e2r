<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#f778ba"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.68" stop-color="#58a6ff"/>
      <stop offset="0.68" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f778ba" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <style>
      .draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 4.5s ease-out forwards infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; } 65% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      .cone { opacity: 0; animation: fade 4.5s ease-out infinite; }
      @keyframes fade { 0%,55% { opacity: 0; } 70%,100% { opacity: 1; } }
      .rise { opacity: 0; animation: rise 1.2s ease-out forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .35; } }
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>

  <!-- forecast cone + animated series -->
  <g transform="translate(600 40)">
    <path class="cone" d="M380 150 L560 70 L560 230 Z" fill="url(#cone)"/>
    <path class="draw" filter="url(#glow)" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
      d="M0 210 C30 190 50 230 80 200 S130 140 160 170 S210 230 240 180 S290 110 320 140 S360 175 380 150 S430 95 460 120 S520 140 560 110"/>
    <circle class="pulse" cx="560" cy="110" r="6" fill="#f778ba"/>
    <circle class="pulse" cx="380" cy="150" r="5" fill="#58a6ff" style="animation-delay:.4s"/>
    <text x="380" y="262" fill="#8b949e" font-size="13" text-anchor="middle">now</text>
    <line x1="380" y1="40" x2="380" y2="248" stroke="#30363d" stroke-dasharray="4 6"/>
  </g>

  <!-- copy -->
  <g class="rise d1"><text x="60" y="130" font-size="58" font-weight="800" fill="url(#title)">Forecasting E2R</text></g>
  <g class="rise d2"><text x="62" y="172" font-size="21" fill="#e6edf3">End-to-end time-series forecasting</text></g>
  <g class="rise d3">
    <text x="62" y="205" font-size="15" fill="#8b949e">ARIMA · SARIMA · XGBoost · LSTM · Prophet</text>
    <rect x="62" y="232" width="150" height="32" rx="16" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="137" y="253" font-size="13" fill="#58a6ff" text-anchor="middle">5 models</text>
    <rect x="224" y="232" width="190" height="32" rx="16" fill="#f778ba" fill-opacity="0.12" stroke="#f778ba" stroke-opacity="0.5"/>
    <text x="319" y="253" font-size="13" fill="#f778ba" text-anchor="middle">hybrid-ready design</text>
  </g>
</svg>
